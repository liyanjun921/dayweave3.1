<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>序时部署 · 两个安全口令生成器</title><style>
:root{color-scheme:light}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#513b55;background:linear-gradient(135deg,#faedf3,#eeeafc 55%,#e9f6ef);margin:0;padding:36px 16px;min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center}.panel{width:min(650px,100%);padding:28px;border:1px solid #fff;border-radius:28px;background:#ffffffc7;box-shadow:0 20px 55px #7774a032;backdrop-filter:blur(18px)}h1{font-size:26px}h2{font-size:19px;margin:26px 0 5px}p{line-height:1.8;color:#715f76}label{font-weight:700;font-size:14px}textarea{box-sizing:border-box;width:100%;resize:vertical;min-height:72px;border-radius:13px;border:1px solid #decfdb;padding:10px;font:13px monospace;margin:12px 0;overflow-wrap:anywhere;background:#fff}button{cursor:pointer;border:0;border-radius:999px;background:#9872a1;padding:12px 19px;color:white;font-weight:650;margin:4px 8px 6px 0}button.secondary{background:#e9ddeb;color:#513b55}code{word-break:break-all}small{color:#907c91}
</style></head><body><main class="panel"><h1>✿ 序时 · 部署密钥生成器</h1><p>在这台设备的浏览器本地生成两个随机口令。<strong>不要分享口令，也不要上传 GitHub。</strong></p>
<h2>① 服务器加密密钥</h2><label for="server">Netlify 环境变量：<code>DAYWEAVE_SERVER_SECRET</code></label><p>必须是 32 字节随机数的 Base64 编码，用于登录会话签名与 AI Key 加密。请保存一份私人备份，后续不要随意更换。</p><textarea id="server" readonly placeholder="点击下方按钮生成"></textarea><button onclick="makeServer()">生成服务器密钥</button><button class="secondary" onclick="copy('server')">复制①</button>
<h2>② 首次创建站长的口令</h2><label for="setup">Netlify 环境变量：<code>DAYWEAVE_SETUP_CODE</code></label><p>仅用于创建首位管理员。成功创建管理员后，应在 Netlify 删除此变量并重新部署。</p><textarea id="setup" readonly placeholder="点击下方按钮生成"></textarea><button onclick="makeSetup()">生成初始化口令</button><button class="secondary" onclick="copy('setup')">复制②</button>
<p><small>本站不会向外发送任何数据。复制到 Netlify 的环境变量，不要填写到网页中的 API Key 表单。请勿把带真实密钥的截图发给他人。</small></p>
</main><script>
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function makeServer(){document.getElementById('server').value=btoa(String.fromCharCode(...rand(32)))}
function makeSetup(){document.getElementById('setup').value=Array.from(rand(32),x=>x.toString(16).padStart(2,'0')).join('')}
async function copy(id){const e=document.getElementById(id);if(!e.value)return alert('请先生成口令');try{await navigator.clipboard.writeText(e.value);alert('已复制')}catch{e.focus();e.select();alert('请按 Ctrl+C 或长按复制')}}
</script></body></html>
